<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700">
<rect width="1200" height="700" fill="white"/>
<rect x="30" y="25" width="1140" height="70" fill="#eeeeee" stroke="#333"/>
<text x="60" y="70" font-family="Arial" font-size="30" font-weight="bold">GenOpt — Smart Energy Demand & Appliance Scheduling</text>
<rect x="30" y="120" width="540" height="420" fill="white" stroke="#333"/>
<text x="55" y="155" font-family="Arial" font-size="24" font-weight="bold">INPUTS</text>
